<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>FlowPOS Pro — تسجيل الدخول</title>
<style>
  body{font-family:system-ui,Segoe UI,Tahoma,sans-serif;background:#f5f7fb;color:#1f2937;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
  .card{background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08);padding:28px 32px;max-width:420px;text-align:center}
  a.btn{display:inline-block;margin-top:16px;background:#2563eb;color:#fff;text-decoration:none;padding:12px 22px;border-radius:12px;font-weight:700}
  p{color:#4b5563;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <h2 id="t">جاري العودة إلى FlowPOS Pro…</h2>
  <p id="m">إذا سألك المتصفح «فتح FlowPOS Pro؟» اضغط فتح، ثم يمكنك إغلاق هذه الصفحة.</p>
  <a class="btn" id="b" href="#">فتح FlowPOS Pro</a>
</div>
<script>
  // صفحة وسيطة لتسجيل الدخول بجوجل على الكمبيوتر: تنقل الرموز من الرابط إلى التطبيق عبر flowpos://
  (function () {
    var frag = window.location.hash || '';
    var query = window.location.search || '';
    var target = 'flowpos://auth-callback' + query + frag;
    // إزالة الرموز من شريط العنوان وسجل المتصفح
    try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
    var b = document.getElementById('b');
    if (!frag && !query) {
      document.getElementById('t').textContent = 'رابط غير صالح';
      document.getElementById('m').textContent = 'ارجع إلى التطبيق وحاول تسجيل الدخول مجدداً.';
      b.style.display = 'none';
      return;
    }
    b.href = target;
    window.location.href = target;
  })();
</script>
</body>
</html>
