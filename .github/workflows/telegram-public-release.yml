name: Telegram public release

# يُشغَّل يدوياً فقط، ويُستدعى أيضاً من لوحة Boss عبر دوال Supabase
# (publish-telegram-release / trigger-public-release) التي ترسل بالضبط:
#   confirm_publish = "true"  و  source_branch = "main"
# ⚠️ لا تغيّر اسم الملف ولا أسماء المدخلات أدناه وإلا ينكسر زر النشر في اللوحة.
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'الفرع المستهدف'
        required: true
        default: 'main'
        type: string
      confirm_publish:
        description: 'تأكيد إرسال النسخة الجاهزة'
        required: true
        default: 'true'
        type: string
      custom_notes:
        description: 'ملاحظات التحديث (اختياري)'
        required: false
        default: ''
        type: string

concurrency:
  group: telegram-release
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && (inputs.confirm_publish == 'true' || inputs.confirm_publish == true)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.source_branch }}

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Read application version
        shell: bash
        run: |
          VERSION_NAME=$(node -p "require('./version.json').versionName")
          VERSION_CODE=$(node -p "require('./version.json').versionCode")
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "🎯 Target Version: v$VERSION_NAME (Build $VERSION_CODE)"

      # سحب الـ APK الجاهز من Artifacts دون أي بناء:
      #  1) يفضّل artifact باسم FlowPOS-v<الإصدار الحالي>
      #  2) وإن لم يوجد يأخذ أحدث APK (نفس سلوك النسخة القديمة) مع تحذير ظاهر في السجل
      #  3) يبحث عن ملف .apk داخل الـ zip بشكل متداخل (النسخة الجديدة كانت تقرأ المستوى الأول فقط)
      - name: Grab Ready APK Instantly (Skip Build)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          command -v unzip >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq unzip; }
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const { GH_TOKEN, REPO, VERSION_NAME, GITHUB_ENV } = process.env;
          const TMP = process.env.RUNNER_TEMP || '/tmp';
          const headers = {
            Authorization: `Bearer ${GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const byNewest = (a, b) => new Date(b.created_at) - new Date(a.created_at);

          async function gh(url) {
            const r = await fetch(url, { headers });
            if (!r.ok) throw new Error(`GitHub API ${r.status} ${r.statusText} — ${url}`);
            return r;
          }

          function findApk(dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) { const f = findApk(p); if (f) return f; }
              else if (e.name.toLowerCase().endsWith('.apk')) return p;
            }
            return null;
          }

          async function run() {
            const base = `https://api.github.com/repos/${REPO}/actions/artifacts`;
            let art = null;

            const exactName = `FlowPOS-v${VERSION_NAME}`;
            const exact = await (await gh(`${base}?name=${encodeURIComponent(exactName)}&per_page=20`)).json();
            art = (exact.artifacts || []).filter((a) => !a.expired).sort(byNewest)[0] || null;

            if (art) {
              console.log(`🎯 Found artifact for the current version: ${art.name} (ID: ${art.id})`);
            } else {
              const list = await (await gh(`${base}?per_page=100`)).json();
              art = (list.artifacts || [])
                .filter((a) => !a.expired && /flowpos/i.test(a.name) && !/win|exe|setup/i.test(a.name))
                .sort(byNewest)[0] || null;
              if (!art) {
                throw new Error('لم يتم العثور على ملف APK جاهز مسبقاً! شغّل «Build FlowPOS Pro APK» مرة واحدة أولاً.');
              }
              console.log(`::warning::لا يوجد artifact باسم ${exactName}. سيتم استخدام أحدث APK متاح: ${art.name}`);
            }

            const dir = path.join(TMP, 'ready-apk');
            fs.rmSync(dir, { recursive: true, force: true });
            fs.mkdirSync(dir, { recursive: true });

            const zipRes = await gh(`${base}/${art.id}/zip`); // fetch يتبع إعادة التوجيه لـ blob storage تلقائياً
            const zipPath = path.join(dir, 'artifact.zip');
            fs.writeFileSync(zipPath, Buffer.from(await zipRes.arrayBuffer()));
            execFileSync('unzip', ['-q', '-o', zipPath, '-d', path.join(dir, 'x')]);

            const apk = findApk(path.join(dir, 'x'));
            if (!apk) throw new Error('ملف الـ APK غير موجود داخل الحزمة.');

            const target = path.join(TMP, `FlowPOS-v${VERSION_NAME}.apk`);
            fs.copyFileSync(apk, target);
            console.log(`📦 APK ready: ${target} (${(fs.statSync(target).size / 1024 / 1024).toFixed(2)} MB)`);
            fs.appendFileSync(GITHUB_ENV, `APK_PATH=${target}\n`);
          }

          run().catch((e) => { console.log('::error::' + e.message); process.exit(1); });
          NODE

      # كل منطق تيليجرام (تحديد القناة، فحص صلاحيات البوت، الوصف، الحد 1024، إعادة المحاولة)
      # موجود في scripts/telegram-send-apk.cjs
      - name: Send APK to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: node scripts/telegram-send-apk.cjs
