name: Build FlowPOS Pro APK

on:
  push:
    branches: [ main, event-or-artifact ]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/telegram-public-release.yml'
  workflow_dispatch:
    inputs:
      publish_telegram:
        description: 'إرسال الـ APK لتيليجرام بعد انتهاء البناء مباشرة'
        required: false
        default: false
        type: boolean
      custom_notes:
        description: 'ملاحظات مخصصة للنشر (اختياري)'
        required: false
        default: ''
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: true

      - name: Setup Java (Temurin JDK 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Read authoritative version
        shell: bash
        run: |
          VERSION_NAME=$(node -p "require('./version.json').versionName")
          VERSION_CODE=$(node -p "require('./version.json').versionCode")
          
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building FlowPOS Pro: v$VERSION_NAME (Build $VERSION_CODE)"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build embedded web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
          VITE_VERSION_NAME: ${{ env.VERSION_NAME }}
          VITE_VERSION_CODE: ${{ env.VERSION_CODE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: npm run build

      - name: Sync embedded files to Android
        run: npx cap sync android

      - name: Setup release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets.ANDROID_KEYSTORE_BASE64..."
            CLEAN_B64=$(echo "$KEYSTORE_BASE64" | sed '/^-----/d' | tr -d '\r\n[:space:]')
            echo "$CLEAN_B64" | base64 -d > android/app/flowpos-release.keystore 2>/dev/null || echo "$CLEAN_B64" | base64 -di > android/app/flowpos-release.keystore
          fi

          if [ -f "android/app/flowpos-release.keystore" ]; then
            if [ -n "$KEYSTORE_PASS" ] && keytool -list -keystore android/app/flowpos-release.keystore -storepass "$KEYSTORE_PASS" >/dev/null 2>&1; then
              echo "✅ Using configured production keystore credentials."
            else
              echo "::error::Production keystore password (ANDROID_KEYSTORE_PASSWORD) is missing or invalid. Aborting build."
              exit 1
            fi
          else
            echo "::error::Release keystore file is missing or failed to decode. Aborting."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS=$(keytool -list -keystore android/app/flowpos-release.keystore -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -m 1 "PrivateKeyEntry" | awk -F',' '{print $1}' | tr -d ' ' || echo "flowpos_prod")
            if [ -z "$KEY_ALIAS" ]; then
              KEY_ALIAS="flowpos_prod"
            fi
          fi

          echo "KEYSTORE_PATH=flowpos-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASS:-$KEYSTORE_PASS}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_PATH: flowpos-release.keystore
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --warning-mode=none

      - name: Prepare single versioned APK
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          VERSION="${{ env.VERSION_NAME }}"
          FINAL_APK="FlowPOS-v${VERSION}.apk"
          
          SRC_APK=$(ls $RELEASE_DIR/*.apk 2>/dev/null | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: No APK found in $RELEASE_DIR"
            exit 1
          fi
          
          mv "$SRC_APK" "$RELEASE_DIR/$FINAL_APK"
          find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "$FINAL_APK" -delete
          
          echo "FINAL_APK_NAME=$FINAL_APK" >> "$GITHUB_ENV"
          echo "FINAL_APK_PATH=$RELEASE_DIR/$FINAL_APK" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_DIR/$FINAL_APK"

      # رفع الحزمة وحفظها لمدة 90 يوماً
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: FlowPOS-v${{ env.VERSION_NAME }}
          path: ${{ env.FINAL_APK_PATH }}
          retention-days: 90
          compression-level: 0

      # حماية الـ 30 نسخة تلقائياً ومسح ما زاد عنها فقط
      - name: Keep Latest 30 Artifacts (Prune Older)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
          async function pruneArtifacts() {
            const token = process.env.GH_TOKEN;
            const repo = process.env.REPO;
            if (!token || !repo) return;

            console.log("🔍 Checking existing artifacts count...");
            const res = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts?per_page=100`, {
              headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
            });
            if (!res.ok) {
              console.log("Could not fetch artifacts list:", res.statusText);
              return;
            }

            const data = await res.json();
            const artifacts = (data.artifacts || [])
              .filter(a => !a.expired && a.name.toLowerCase().includes("flowpos"))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            console.log(`📊 Found ${artifacts.length} active FlowPOS artifacts.`);
            const KEEP_LIMIT = 30;

            if (artifacts.length > KEEP_LIMIT) {
              const toDelete = artifacts.slice(KEEP_LIMIT);
              console.log(`🧹 Removing ${toDelete.length} older artifacts to maintain exactly ${KEEP_LIMIT}...`);
              for (const item of toDelete) {
                try {
                  const delRes = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts/${item.id}`, {
                    method: "DELETE",
                    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
                  });
                  if (delRes.ok) console.log(`   Deleted: ${item.name} (ID: ${item.id})`);
                } catch (e) {}
              }
            } else {
              console.log(`✅ Artifacts count (${artifacts.length}) is within safe limit (${KEEP_LIMIT}). Nothing pruned.`);
            }
          }
          pruneArtifacts().catch(console.error);
          '

      # مزامنة رقم الإصدار الجديد مع السحابة فوراً
      - name: Sync release metadata to cloud
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SERVICE_KEY" ]; then
            echo "📡 Syncing release metadata to cloud..."
            node -e "
              const fs = require('fs');
              const v = require('./version.json');
              const payload = {
                latest_version_code: v.versionCode,
                latest_version_name: v.versionName,
                commit_sha: process.env.COMMIT_SHA,
                commit_message: 'Auto-build v' + v.versionName + ' (Build ' + v.versionCode + ')'
              };
              fs.writeFileSync('sync-payload.json', JSON.stringify(payload, null, 2));
            "
            curl -s -o /dev/null -w "%{http_code}" -X POST "${SUPABASE_URL}/functions/v1/sync-release-metadata" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${SERVICE_KEY}" \
              --data @sync-payload.json || true
          fi

      # نشر اختياري للتيليجرام إذا حُدد أثناء تشغيل البناء يدوياً
      - name: Publish exact APK to Telegram (If Requested)
        if: ${{ inputs.publish_telegram == true }}
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ env.FINAL_APK_PATH }}
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$RAW_CHAT" ]; then
            node scripts/telegram-release-notes.cjs > /tmp/release_caption.txt 2>/dev/null || echo "تحديث جديد FlowPOS Pro" > /tmp/release_caption.txt
            curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendDocument" \
              -F "chat_id=${RAW_CHAT}" \
              -F "document=@${APK_PATH}" \
              -F "caption=$(cat /tmp/release_caption.txt)" >/dev/null || true
          fi
