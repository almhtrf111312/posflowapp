name: Telegram public release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'الفرع المستهدف'
        required: true
        default: main
        type: choice
        options:
          - main
      confirm_publish:
        description: 'تأكيد إرسال النسخة الجاهزة'
        required: true
        default: true
        type: boolean
      custom_notes:
        description: 'ملاحظات التحديث (اختياري)'
        required: false
        default: ''
        type: string

concurrency:
  group: telegram-release
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read application version
        shell: bash
        run: |
          VERSION_NAME=$(node -p "require('./version.json').versionName")
          VERSION_CODE=$(node -p "require('./version.json').versionCode")
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "🎯 Target Version: v$VERSION_NAME (Build $VERSION_CODE)"

      - name: Fetch and Extract Pre-built APK Artifact (Reliable Node.js Stream)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");

          async function run() {
            const token = process.env.GH_TOKEN;
            const repo = process.env.REPO;
            
            console.log("🔍 Fetching latest artifacts list...");
            const listRes = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts?per_page=30`, {
              headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
            });
            if (!listRes.ok) throw new Error("Failed to fetch artifacts: " + listRes.statusText);
            const list = await listRes.json();
            
            const apkArtifact = list.artifacts.find(a => !a.expired && a.name.toLowerCase().includes("flowpos") && !/win|exe|setup/i.test(a.name));
            if (!apkArtifact) {
              throw new Error("No ready APK artifact found! Please wait for the build to finish or run Build APK once.");
            }
            console.log(`📦 Found artifact: ${apkArtifact.name} (ID: ${apkArtifact.id})`);

            fs.mkdirSync("/tmp/ready-apk", { recursive: true });
            
            // تنزيل نظيف يتجنب مشاكل curl مع S3
            const zipRes = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts/${apkArtifact.id}/zip`, {
              headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
            });
            if (!zipRes.ok) throw new Error("Failed to download zip: " + zipRes.statusText);
            const buffer = Buffer.from(await zipRes.arrayBuffer());
            fs.writeFileSync("/tmp/ready-apk/artifact.zip", buffer);

            execSync("unzip -q -o /tmp/ready-apk/artifact.zip -d /tmp/ready-apk");
            const apkFile = execSync("find /tmp/ready-apk -name \"*.apk\" | head -n 1", { encoding: "utf8" }).trim();
            if (!apkFile || !fs.existsSync(apkFile)) {
              throw new Error("No .apk found inside the downloaded artifact zip.");
            }

            const targetName = `FlowPOS-v${process.env.VERSION_NAME}.apk`;
            fs.copyFileSync(apkFile, targetName);
            console.log(`✅ Extracted ready APK: ${targetName} (${(fs.statSync(targetName).size / 1024 / 1024).toFixed(2)} MB)`);
          }
          run().catch(e => { console.error("::error::" + e.message); process.exit(1); });
          '
          echo "APK_PATH=$GITHUB_WORKSPACE/FlowPOS-v${{ env.VERSION_NAME }}.apk" >> "$GITHUB_ENV"

      - name: Resolve Telegram Channel Target
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is missing in GitHub Secrets"
            exit 1
          fi

          RAW_CHAT=$(echo "$RAW_CHAT" | tr -d '[:space:]')
          CANDIDATES=""

          if [ -n "$RAW_CHAT" ]; then
            CANDIDATES="$RAW_CHAT"
            if echo "$RAW_CHAT" | grep -qE '^[0-9]+$'; then
              CANDIDATES="$CANDIDATES -100$RAW_CHAT"
            fi
            if echo "$RAW_CHAT" | grep -qE '^[A-Za-z][A-Za-z0-9_]+$'; then
              CANDIDATES="$CANDIDATES @$RAW_CHAT"
            fi
          fi

          AUTO_CHATS=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getUpdates" | jq -r '.result[]? | (.message.chat.id // .channel_post.chat.id // .my_chat_member.chat.id) | select(. != null)' 2>/dev/null | tac | uniq | tr '\n' ' ' || true)
          CANDIDATES="$CANDIDATES $AUTO_CHATS @flowpospro"

          FOUND_CHANNEL=""
          for C in $CANDIDATES; do
            R=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getChat" --data-urlencode "chat_id=$C" || true)
            if echo "$R" | grep -q '"ok":true'; then
              echo "✅ Verified Telegram target channel: $C"
              FOUND_CHANNEL="$C"
              break
            fi
          done

          if [ -z "$FOUND_CHANNEL" ]; then
            echo "::error::Bot cannot access the channel. Please ensure the Bot is an Admin with 'Post Messages' permission."
            exit 1
          fi

          echo "CHANNEL=$FOUND_CHANNEL" >> "$GITHUB_ENV"

      - name: Send Ready APK Directly to Telegram (~10 seconds)
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: ${{ env.CHANNEL }}
          APK_PATH: ${{ env.APK_PATH }}
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          BUILD_DATE=$(TZ='Asia/Damascus' date +'%Y-%m-%d (%H:%M)')

          if [ -n "$CUSTOM_NOTES" ]; then
            RAW_NOTES="$CUSTOM_NOTES"
          elif [ -f "scripts/telegram-release-notes.cjs" ]; then
            RAW_NOTES=$(node scripts/telegram-release-notes.cjs)
          else
            RAW_NOTES=$(git log -3 --pretty=format:"• %s")
          fi

          SAFE_NOTES=$(echo "$RAW_NOTES" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          CAPTION="🚀 <b>تحديث جديد | Flow POS Pro</b>
          ━━━━━━━━━━━━━━
          📌 <b>الإصدار:</b> <code>v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})</code>
          📦 <b>حجم الملف:</b> <code>${APK_SIZE}B</code>
          📅 <b>تاريخ النشر:</b> <code>${BUILD_DATE}</code>

          ✨ <b>أبرز التحديثات والإصلاحات:</b>
          <blockquote>${SAFE_NOTES}</blockquote>
          ━━━━━━━━━━━━━━
          💡 <i>يمكنك تثبيت هذا التحديث مباشرة فوق النسخة الحالية دون حذف بياناتك.</i>"

          REPLY_MARKUP='{"inline_keyboard":[[{"text":"📢 قناة التحديثات الرسمية","url":"https://t.me/flowpospro"}]]}'

          curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendDocument" \
            --form-string "chat_id=${CHANNEL}" \
            -F "document=@${APK_PATH}" \
            --form-string "parse_mode=HTML" \
            --form-string "reply_markup=${REPLY_MARKUP}" \
            --form-string "caption=${CAPTION}"

          echo "🎉 APK sent directly to Telegram in seconds without rebuilding!"
