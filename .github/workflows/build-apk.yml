name: Build FlowPOS Pro APK

on:
  push:
    branches: [ main, event-or-artifact ]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/telegram-public-release.yml'
      - '.github/workflows/sync-version-to-cloud.yml'
  workflow_dispatch:
    inputs:
      publish_telegram:
        description: 'إرسال الـ APK لتيليجرام بعد انتهاء البناء مباشرة'
        required: false
        default: false
        type: boolean
      custom_notes:
        description: 'ملاحظات مخصصة للنشر (اختياري)'
        required: false
        default: ''
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Java (Temurin JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read authoritative version
        shell: bash
        run: |
          VERSION_NAME=$(node -p "require('./version.json').versionName")
          VERSION_CODE=$(node -p "require('./version.json').versionCode")
          
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building FlowPOS Pro: v$VERSION_NAME (Build $VERSION_CODE)"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build embedded web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
          VITE_VERSION_NAME: ${{ env.VERSION_NAME }}
          VITE_VERSION_CODE: ${{ env.VERSION_CODE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: npm run build

      - name: Sync embedded files to Android
        run: npx cap sync android

      - name: Setup release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets.ANDROID_KEYSTORE_BASE64..."
            # تنظيف الترويسات ومسافات وفواصل أسطر ويندوز
            CLEAN_B64=$(echo "$KEYSTORE_BASE64" | sed '/^-----/d' | tr -d '\r\n[:space:]')
            echo "$CLEAN_B64" | base64 -d > android/app/flowpos-release.keystore 2>/dev/null || echo "$CLEAN_B64" | base64 -di > android/app/flowpos-release.keystore
          fi

          if [ -f "android/app/flowpos-release.keystore" ]; then
            if [ -n "$KEYSTORE_PASS" ] && keytool -list -keystore android/app/flowpos-release.keystore -storepass "$KEYSTORE_PASS" >/dev/null 2>&1; then
              echo "Using configured production keystore credentials."
            else
              echo "::error::Production keystore password (ANDROID_KEYSTORE_PASSWORD) is missing or invalid. Aborting build."
              exit 1
            fi
          else
            echo "::error::Release keystore file is missing or failed to decode. Aborting."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS=$(keytool -list -keystore android/app/flowpos-release.keystore -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -m 1 "PrivateKeyEntry" | awk -F',' '{print $1}' | tr -d ' ' || echo "flowpos_prod")
            if [ -z "$KEY_ALIAS" ]; then
              KEY_ALIAS="flowpos_prod"
            fi
          fi

          echo "KEYSTORE_PATH=flowpos-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASS:-$KEYSTORE_PASS}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_PATH: flowpos-release.keystore
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode=all

      - name: Prepare single versioned APK
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          VERSION="${{ env.VERSION_NAME }}"
          FINAL_APK="FlowPOS-v${VERSION}.apk"
          
          SRC_APK=$(ls $RELEASE_DIR/*.apk 2>/dev/null | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: No APK found in $RELEASE_DIR"
            exit 1
          fi
          
          mv "$SRC_APK" "$RELEASE_DIR/$FINAL_APK"
          find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "$FINAL_APK" -delete
          
          echo "FINAL_APK_NAME=$FINAL_APK" >> "$GITHUB_ENV"
          echo "FINAL_APK_PATH=$RELEASE_DIR/$FINAL_APK" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_DIR/$FINAL_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowPOS-v${{ env.VERSION_NAME }}
          path: ${{ env.FINAL_APK_PATH }}
          retention-days: 5

      - name: Publish exact APK to Telegram (If Requested)
        if: ${{ inputs.publish_telegram == true }}
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ env.FINAL_APK_PATH }}
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is missing in secrets"
            exit 1
          fi

          RAW_CHAT=$(echo "$RAW_CHAT" | tr -d '[:space:]')
          CANDIDATES=""

          if [ -n "$RAW_CHAT" ]; then
            CANDIDATES="$RAW_CHAT"
            if echo "$RAW_CHAT" | grep -qE '^[0-9]+$'; then
              CANDIDATES="$CANDIDATES -100$RAW_CHAT"
            fi
            if echo "$RAW_CHAT" | grep -qE '^[A-Za-z][A-Za-z0-9_]+$'; then
              CANDIDATES="$CANDIDATES @$RAW_CHAT"
            fi
          fi

          AUTO_CHATS=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getUpdates" | jq -r '.result[]? | (.message.chat.id // .channel_post.chat.id // .my_chat_member.chat.id) | select(. != null)' 2>/dev/null | tac | uniq | tr '\n' ' ' || true)
          CANDIDATES="$CANDIDATES $AUTO_CHATS @flowpospro"

          FOUND_CHANNEL=""
          for C in $CANDIDATES; do
            R=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getChat" --data-urlencode "chat_id=$C" || true)
            if echo "$R" | grep -q '"ok":true'; then
              echo "✅ Verified Telegram target: $C"
              FOUND_CHANNEL="$C"
              break
            fi
          done

          if [ -z "$FOUND_CHANNEL" ]; then
            echo "::error::Could not resolve Telegram channel target."
            exit 1
          fi

          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          BUILD_DATE=$(TZ='Asia/Damascus' date +'%Y-%m-%d (%H:%M)')

          if [ -n "$CUSTOM_NOTES" ]; then
            RAW_NOTES="$CUSTOM_NOTES"
          elif [ -f "scripts/telegram-release-notes.cjs" ]; then
            RAW_NOTES=$(node scripts/telegram-release-notes.cjs)
          else
            RAW_NOTES=$(git log -3 --pretty=format:"• %s")
          fi

          SAFE_NOTES=$(echo "$RAW_NOTES" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          CAPTION="🚀 <b>تحديث جديد | Flow POS Pro</b>
          ━━━━━━━━━━━━━━
          📌 <b>الإصدار:</b> <code>v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})</code>
          📦 <b>حجم الملف:</b> <code>${APK_SIZE}B</code>
          📅 <b>تاريخ النشر:</b> <code>${BUILD_DATE}</code>

          ✨ <b>أبرز التحديثات والإصلاحات:</b>
          <blockquote>${SAFE_NOTES}</blockquote>
          ━━━━━━━━━━━━━━
          💡 <i>يمكنك تثبيت هذا التحديث مباشرة فوق النسخة الحالية دون حذف بياناتك.</i>"

          REPLY_MARKUP='{"inline_keyboard":[[{"text":"📢 قناة التحديثات الرسمية","url":"https://t.me/flowpospro"}]]}'

          curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendDocument" \
            --form-string "chat_id=${FOUND_CHANNEL}" \
            -F "document=@${APK_PATH}" \
            --form-string "parse_mode=HTML" \
            --form-string "reply_markup=${REPLY_MARKUP}" \
            --form-string "caption=${CAPTION}"

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FINAL_APK_PATH }}
          generate_release_notes: true
