name: Telegram public release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'الفرع المستهدف'
        required: true
        default: 'main'
        type: string
      confirm_publish:
        description: 'تأكيد إرسال النسخة الجاهزة'
        required: true
        default: 'true'
        type: string
      custom_notes:
        description: 'ملاحظات التحديث (اختياري)'
        required: false
        default: ''
        type: string

concurrency:
  group: telegram-release
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && (inputs.confirm_publish == 'true' || inputs.confirm_publish == true)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.source_branch }}

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Read application version
        shell: bash
        run: |
          VERSION_NAME=$(node -p "require('./version.json').versionName")
          VERSION_CODE=$(node -p "require('./version.json').versionCode")
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "🎯 Target Version: v$VERSION_NAME (Build $VERSION_CODE)"

      # سحب فوري لأحدث APK جاهز من الـ Artifacts في 5 ثوانٍ
      - name: Grab Ready APK Instantly (Skip Build - 5 Seconds)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");

          async function run() {
            const token = process.env.GH_TOKEN;
            const repo = process.env.REPO;
            
            console.log("⚡ Fetching pre-built APK from GitHub Artifacts...");
            const listRes = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts?per_page=30`, {
              headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
            });
            if (!listRes.ok) throw new Error("Failed to list artifacts: " + listRes.statusText);
            const list = await listRes.json();
            
            const apkArtifact = list.artifacts.find(a => !a.expired && a.name.toLowerCase().includes("flowpos") && !/win|exe|setup/i.test(a.name));
            if (!apkArtifact) {
              throw new Error("لم يتم العثور على ملف APK جاهز مسبقاً! يرجى تشغيل بناء APK مرة واحدة أولاً.");
            }

            console.log(`📦 Found pre-built artifact: ${apkArtifact.name} (ID: ${apkArtifact.id})`);
            
            fs.mkdirSync("/tmp/ready-apk", { recursive: true });
            
            const zipRes = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts/${apkArtifact.id}/zip`, {
              headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
            });
            if (!zipRes.ok) throw new Error("Failed to download artifact zip: " + zipRes.statusText);
            
            const arrayBuffer = await zipRes.arrayBuffer();
            fs.writeFileSync("/tmp/ready-apk/artifact.zip", Buffer.from(arrayBuffer));
            
            execSync("unzip -q -o /tmp/ready-apk/artifact.zip -d /tmp/ready-apk");
            
            const files = fs.readdirSync("/tmp/ready-apk");
            const targetApk = files.find(f => f.endsWith(".apk"));
            if (!targetApk) throw new Error("No APK inside the downloaded artifact zip!");
            
            console.log(`✅ Extracted APK: /tmp/ready-apk/${targetApk}`);
            fs.writeFileSync("/tmp/ready-apk/exact_path.txt", `/tmp/ready-apk/${targetApk}`);
          }
          run().catch(err => {
            console.error("❌ " + err.message);
            process.exit(1);
          });
          '

      # التحقق من هوية البوت ومعرف القناة
      - name: Verify Bot & Resolve Channel
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is missing in secrets"
            exit 1
          fi

          echo "🔍 Checking Telegram Bot Identity..."
          ME_RES=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getMe" || true)
          echo "🤖 Bot Info: $ME_RES"

          if ! echo "$ME_RES" | grep -q '"ok":true'; then
            echo "::error::Invalid TELEGRAM_BOT_TOKEN!"
            exit 1
          fi

          CLEAN_CHAT=$(echo "$RAW_CHAT" | tr -d '[:space:]"' | tr -d "'")
          if [ -z "$CLEAN_CHAT" ]; then
            echo "::error::TELEGRAM_CHAT_ID is missing in secrets"
            exit 1
          fi

          echo "TARGET_CHANNEL=$CLEAN_CHAT" >> "$GITHUB_ENV"

      # إرسال ملف APK المباشر إلى القناة
      - name: Dispatch APK to Telegram Channel
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: ${{ env.TARGET_CHANNEL }}
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          APK_PATH=$(cat /tmp/ready-apk/exact_path.txt)
          node scripts/telegram-release-notes.cjs > /tmp/release_caption.txt 2>/dev/null || echo "تحديث جديد FlowPOS Pro" > /tmp/release_caption.txt

          echo "📤 Sending APK to Telegram channel ($CHANNEL)..."
          HTTP_RES=$(curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendDocument" \
            -F "chat_id=${CHANNEL}" \
            -F "document=@${APK_PATH}" \
            -F "caption=$(cat /tmp/release_caption.txt)" \
            -F "parse_mode=HTML")

          echo "Response: $HTTP_RES"

          if echo "$HTTP_RES" | grep -q '"ok":true'; then
            echo "🚀 Sent successfully to Telegram!"
          else
            # محاولة أخيرة بإضافة بادئة -100 إذا كان المعرف أرقاماً فقط بدون بادئة
            if echo "$CHANNEL" | grep -qE '^[0-9]+$'; then
              ALT_CHANNEL="-100$CHANNEL"
              echo "🔄 Retrying with prefix -100: $ALT_CHANNEL..."
              HTTP_RES2=$(curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendDocument" \
                -F "chat_id=${ALT_CHANNEL}" \
                -F "document=@${APK_PATH}" \
                -F "caption=$(cat /tmp/release_caption.txt)" \
                -F "parse_mode=HTML")
              echo "Retry Response: $HTTP_RES2"
              if echo "$HTTP_RES2" | grep -q '"ok":true'; then
                echo "🚀 Sent successfully on retry!"
                exit 0
              fi
            fi
            echo "::error::Failed to send APK to Telegram. Verify that the bot is an Admin in the channel with Post Messages permission."
            exit 1
          fi
