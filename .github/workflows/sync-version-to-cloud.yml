name: Sync Version Metadata to Cloud

on:
  workflow_run:
    workflows: ["Build FlowPOS Pro APK"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: sync-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Prepare Payload & Sync to Cloud Function
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is missing. Skipping sync."
            exit 0
          fi

          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const v = require('./version.json');
            let msg = 'Automatic Build Sync';
            try {
              msg = execSync('git log -1 --pretty=%B', { encoding: 'utf-8' }).trim().split('\n')[0];
            } catch (e) {}
            const payload = {
              latest_version_code: v.versionCode,
              latest_version_name: v.versionName,
              commit_sha: process.env.COMMIT_SHA,
              commit_message: msg
            };
            fs.writeFileSync('sync-payload.json', JSON.stringify(payload, null, 2));
          "

          STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "${SUPABASE_URL}/functions/v1/sync-release-metadata" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --data @sync-payload.json)

          echo "Response HTTP Status: $STATUS"
          cat response.txt

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Successfully synced version metadata to Cloud!"
          else
            echo "::warning::Failed to sync version metadata (HTTP $STATUS)"
          fi
