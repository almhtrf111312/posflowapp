<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PosFlow - خطأ في التحميل</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #ffffff;
      font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    
    .error-container {
      max-width: 450px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 40px 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }
    
    .error-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    h1 {
      color: #f43f5e;
      font-size: 24px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    
    p {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    button {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }
    
    button.secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      box-shadow: none;
    }
    
    .help-text {
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
    }
    
    .version {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-icon">⚠️</div>
    <h1>تعذر تحميل التطبيق</h1>
    <p>
      تأكد من اتصالك بالإنترنت وحاول مرة أخرى.
      <br>
      إذا استمرت المشكلة، أعد تثبيت البرنامج.
    </p>
    
    <div class="actions">
      <button onclick="location.reload()">
        🔄 إعادة المحاولة
      </button>
      <button class="secondary" onclick="tryOnlineVersion()">
        🌐 فتح النسخة السحابية
      </button>
    </div>
    
    <p class="help-text">
      للمساعدة: تواصل مع الدعم الفني
    </p>
  </div>
  
  <div class="version">PosFlow Desktop</div>
  
  <script>
    function tryOnlineVersion() {
      const { shell } = require('electron');
      shell.openExternal('https://posflowapp.pages.dev');
    }
    
    // Auto-retry after 10 seconds
    setTimeout(() => {
      location.reload();
    }, 10000);
  </script>
</body>
</html>
