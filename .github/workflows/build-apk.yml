name: Build PosFlow APK

on:
  push:
    branches: [ main, event-or-artifact ]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/telegram-public-release.yml'
      - '.github/workflows/sync-version-to-cloud.yml'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/auto-version-bump.yml'
  workflow_dispatch:
    inputs:
      publish_telegram:
        description: 'إرسال الـ APK لتيليجرام بعد انتهاء البناء مباشرة'
        required: false
        default: false
        type: boolean
      custom_notes:
        description: 'ملاحظات مخصصة للنشر (اختياري)'
        required: false
        default: ''
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Java (Temurin JDK 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Setup Gradle
        # مثبّت على v6.3.0: الإصدارات الأحدث تضيف تنبيه «Gradle out of date» لأي إصدار ليس الأحدث،
        # والأحدث (9.6+) غير متوافق مع Android Gradle Plugin 8 الذي تحتاجه إضافات Capacitor حالياً
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: false

      # رفع رقم الإصدار قبل البناء (وليس بعده) حتى يطابق رقم الـ APK المبني آخر رقم على main
      # كان الرفع يتم بعد البناء في ملف منفصل، فيظهر على main إصدار لم يُبنَ أبداً
      # التشغيل اليدوي (workflow_dispatch) كان يلغي تشغيل الـ push الذي يرفع الرقم (concurrency)، فتخرج عدة بناءات بنفس الرقم.
      # الآن يرفع الرقم أيضاً في التشغيل اليدوي على main، إلا إذا كان آخر commit هو نفسه commit رفع الرقم.
      - name: Bump version before build (main pushes and manual runs)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'chore(release)')
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%s | grep -q '^chore(release)'; then
            echo "ℹ️ HEAD is already a release commit. Building it as is."
            exit 0
          fi
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qx 'version.json'; then
            echo "ℹ️ version.json already updated in this commit. Building it as is."
            exit 0
          fi
          node scripts/bump-version.js --desc "Auto-bump on push (${GITHUB_SHA:0:7})"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json public/version.json package.json package-lock.json
          NEW_VER=$(node -p "require('./version.json').versionName")
          NEW_CODE=$(node -p "require('./version.json').versionCode")
          git commit -m "chore(release): bump version to v${NEW_VER} (Build ${NEW_CODE}) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "✅ Version v${NEW_VER} (Build ${NEW_CODE}) committed to main before building."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Could not push the version bump to main; the APK still uses v${NEW_VER}."

      - name: Read authoritative version
        shell: bash
        run: |
          VERSION_NAME=$(node -p "require('./version.json').versionName")
          VERSION_CODE=$(node -p "require('./version.json').versionCode")
          
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building PosFlow: v$VERSION_NAME (Build $VERSION_CODE)"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build embedded web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
          VITE_VERSION_NAME: ${{ env.VERSION_NAME }}
          VITE_VERSION_CODE: ${{ env.VERSION_CODE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: npm run build

      - name: Sync embedded files to Android
        run: npx cap sync android

      - name: Ensure compatible Android Gradle Plugin & Gradle syntax
        shell: bash
        run: |
          if [ -f "android/build.gradle" ]; then
            sed -i -E "s/com\.android\.tools\.build:gradle:[0-9.]+/com.android.tools.build:gradle:8.13.0/g" android/build.gradle
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E "s/signingConfig[[:space:]]+signingConfigs\.release/signingConfig = signingConfigs.release/g" android/app/build.gradle
          fi

      - name: Setup release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets.ANDROID_KEYSTORE_BASE64..."
            CLEAN_B64=$(echo "$KEYSTORE_BASE64" | sed '/^-----/d' | tr -d '\r\n[:space:]')
            echo "$CLEAN_B64" | base64 -d > android/app/posflow-release.keystore 2>/dev/null || echo "$CLEAN_B64" | base64 -di > android/app/posflow-release.keystore
          fi

          if [ -f "android/app/posflow-release.keystore" ]; then
            if [ -n "$KEYSTORE_PASS" ] && keytool -list -keystore android/app/posflow-release.keystore -storepass "$KEYSTORE_PASS" >/dev/null 2>&1; then
              echo "✅ Using configured production keystore credentials."
            else
              echo "::error::Production keystore password (ANDROID_KEYSTORE_PASSWORD) is missing or invalid. Aborting build."
              exit 1
            fi
          else
            echo "::error::Release keystore file is missing or failed to decode. Aborting."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS=$(keytool -list -keystore android/app/posflow-release.keystore -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -m 1 "PrivateKeyEntry" | awk -F',' '{print $1}' | tr -d ' ' || echo "posflow_prod")
            if [ -z "$KEY_ALIAS" ]; then
              KEY_ALIAS="posflow_prod"
            fi
          fi

          echo "KEYSTORE_PATH=posflow-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASS:-$KEYSTORE_PASS}" >> "$GITHUB_ENV"

      - name: Print release key fingerprints (for Google OAuth Android client)
        shell: bash
        run: |
          echo "SHA-1 / SHA-256 of the release signing key (not secret):"
          keytool -list -v -keystore android/app/posflow-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "SHA1:|SHA256:" | sed 's/^[[:space:]]*/  /' | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_PATH: posflow-release.keystore
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --warning-mode=none

      - name: Prepare single versioned APK
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          VERSION="${{ env.VERSION_NAME }}"
          FINAL_APK="PosFlow-v${VERSION}.apk"
          
          SRC_APK=$(ls $RELEASE_DIR/*.apk 2>/dev/null | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: No APK found in $RELEASE_DIR"
            exit 1
          fi
          
          mv "$SRC_APK" "$RELEASE_DIR/$FINAL_APK"
          find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "$FINAL_APK" -delete
          
          echo "FINAL_APK_NAME=$FINAL_APK" >> "$GITHUB_ENV"
          echo "FINAL_APK_PATH=$RELEASE_DIR/$FINAL_APK" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_DIR/$FINAL_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PosFlow-v${{ env.VERSION_NAME }}
          path: ${{ env.FINAL_APK_PATH }}
          retention-days: 90
          compression-level: 6

      - name: Keep Latest 30 Artifacts (Prune Older)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
          async function pruneArtifacts() {
            const token = process.env.GH_TOKEN;
            const repo = process.env.REPO;
            if (!token || !repo) return;

            console.log("🔍 Checking existing artifacts count...");
            const res = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts?per_page=100`, {
              headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
            });
            if (!res.ok) {
              console.log("Could not fetch artifacts list:", res.statusText);
              return;
            }

            const data = await res.json();
            const artifacts = (data.artifacts || [])
              .filter(a => !a.expired && a.name.toLowerCase().includes("posflow") && !/win|exe|setup/i.test(a.name))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            console.log(`📊 Found ${artifacts.length} active PosFlow artifacts.`);
            const KEEP_LIMIT = 30;

            if (artifacts.length > KEEP_LIMIT) {
              const toDelete = artifacts.slice(KEEP_LIMIT);
              console.log(`🧹 Removing ${toDelete.length} older artifacts to maintain exactly ${KEEP_LIMIT}...`);
              for (const item of toDelete) {
                try {
                  const delRes = await fetch(`https://api.github.com/repos/${repo}/actions/artifacts/${item.id}`, {
                    method: "DELETE",
                    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
                  });
                  if (delRes.ok) console.log(`   Deleted: ${item.name} (ID: ${item.id})`);
                } catch (e) {}
              }
            } else {
              console.log(`✅ Artifacts count (${artifacts.length}) is within the safe limit (${KEEP_LIMIT}). Nothing pruned.`);
            }
          }
          pruneArtifacts().catch(console.error);
          '

      - name: Sync release metadata to cloud
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # الـ commit الفعلي المبني (يشمل commit رفع الإصدار إن وُجد)
          export COMMIT_SHA=$(git rev-parse HEAD)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SERVICE_KEY" ]; then
            echo "📡 Syncing release metadata to cloud..."
            node -e "
              const fs = require('fs');
              const v = require('./version.json');
              const payload = {
                latest_version_code: v.versionCode,
                latest_version_name: v.versionName,
                commit_sha: process.env.COMMIT_SHA,
                commit_message: 'Auto-build v' + v.versionName + ' (Build ' + v.versionCode + ')'
              };
              fs.writeFileSync('sync-payload.json', JSON.stringify(payload, null, 2));
            "
            curl -s -o /dev/null -w "%{http_code}\n" -X POST "${SUPABASE_URL}/functions/v1/sync-release-metadata" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${SERVICE_KEY}" \
              --data @sync-payload.json || true
          fi

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.FINAL_APK_PATH }}
          generate_release_notes: true

      - name: Publish exact APK to Telegram (If Requested)
        if: ${{ inputs.publish_telegram == true }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          gh workflow run telegram-public-release.yml \
            --repo "$REPO" \
            --ref "$REF_NAME" \
            -f source_branch="$REF_NAME" \
            -f confirm_publish=true \
            -f custom_notes="$CUSTOM_NOTES"
          echo "✅ تم تشغيل «Telegram public release» — تابع نتيجته في تبويب Actions."
