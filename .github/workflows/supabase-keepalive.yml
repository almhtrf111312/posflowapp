name: Supabase keepalive

# يمنع إيقاف مشروع Supabase المجاني بسبب الخمول (يتوقف بعد 7 أيام بلا نشاط).
# يرسل استعلاماً حقيقياً لقاعدة البيانات كل ~6 أيام. المفتاح المستخدم هو المفتاح العام (publishable) المضمَّن أصلاً في التطبيق.
on:
  schedule:
    - cron: '17 5 */6 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query database
        shell: bash
        run: |
          URL="https://bwlqfxfvchjvehnbvwaz.supabase.co"
          KEY="sb_publishable_iaqWeQX_xMtAW5bbzlsHSA_pw9qvdo7"
          code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" "$URL/rest/v1/stores?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          cat /tmp/out.txt | head -c 300
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
